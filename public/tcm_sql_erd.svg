" x="14" y="25">case_symptom</text><text class="label" x="14" y="44">病例 × 症狀 · 1459 筆</text><text class="field" x="14" y="76">PK FK case_id</text><text class="field" x="14" y="104">PK FK symptom_id</text><text class="field" x="14" y="132">status</text></g><g transform="translate(740 590)"><rect width="280" height="180" rx="8" fill="white" stroke="#8eac9e"/><path d="M0 52 H280" stroke="#ccdcd3"/><text class="name" x="14" y="25">formula</text><text class="label" x="14" y="44">方劑 · 110 筆</text><text class="field" x="14" y="76">PK formula_id</text><text class="field" x="14" y="104">formula_name</text><text class="field" x="14" y="132">category</text><text class="field" x="14" y="160">reference_source</text></g><g transform="translate(1090 240)"><rect width="280" height="180" rx="8" fill="white" stroke="#8eac9e"/><path d="M0 52 H280" stroke="#ccdcd3"/><text class="name" x="14" y="25">herb</text><text class="label" x="14" y="44">藥材 · 49 筆</text><text class="field" x="14" y="76">PK herb_id</text><text class="field" x="14" y="104">herb_name</text><text class="field" x="14" y="132">category</text><text class="field" x="14" y="160">reference_source</text></g><g transform="translate(1090 590)"><rect width="280" height="152" rx="8" fill="white" stroke="#8eac9e"/><path d="M0 52 H280" stroke="#ccdcd3"/><text class="name" x="14" y="25">formula_herb</text><text class="label" x="14" y="44">方劑 × 藥材 · 86 筆</text><text class="field" x="14" y="76">PK FK formula_id</text><text class="field" x="14" y="104">PK FK herb_id</text><text class="field" x="14" y="132">ingredient_order</text></g><g transform="translate(390 590)"><rect width="280" height="152" rx="8" fill="white" stroke="#8eac9e"/><path d="M0 52 H280" stroke="#ccdcd3"/><text class="name" x="14" y="25">case_formula</text><text class="label" x="14" y="44">病例 × 方劑 · 208 筆</text><text class="field" x="14" y="76">PK FK case_id</text><text class="field" x="14" y="104">PK FK formula_id</text><text class="field" x="14" y="132">formula_role</text></g>
<text x="40" y="816" class="name">中醫處方實驗室 · 九表關聯模型</text>
<text x="40" y="844" class="label">1 → N：主表一筆可對應 0 到多筆中介表紀錄。PK：主鍵；FK：外來鍵。中介表的兩個 PK 欄位共同組成複合主鍵。</text>
<text x="40" y="866" class="label">主證：每例至多一筆由部分唯一索引限制；每例恰有一筆由固定資料驗證。完整型別與限制請見網站欄位說明。</text></svg>