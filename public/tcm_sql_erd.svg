<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1430 880" role="img" aria-labelledby="title desc">
<title id="title">中醫處方實驗室：九表關聯模型</title><desc id="desc">五張主表與四張中介表。線段的 1 與 N 表示一對多，每張中介表的兩端為外來鍵和複合主鍵。</desc>
